x-app-environment: &app-environment
  APP_ENV: local
  APP_DEBUG: "true"
  APP_URL: http://localhost:8000
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: freshcart
  DB_USERNAME: freshcart
  DB_PASSWORD: ${FRESHCART_DB_PASSWORD:-freshcart}
  QUEUE_CONNECTION: database

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: freshcart-app
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    environment: *app-environment
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy

  queue:
    image: freshcart-app
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www/html
    command: php artisan queue:work database --tries=3
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    environment: *app-environment
    depends_on:
      mysql:
        condition: service_healthy

  scheduler:
    image: freshcart-app
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www/html
    command: php artisan schedule:work
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    environment: *app-environment
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: freshcart
      MYSQL_USER: freshcart
      MYSQL_PASSWORD: ${FRESHCART_DB_PASSWORD:-freshcart}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "${FRESHCART_DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  mysql_data:
  vendor:
